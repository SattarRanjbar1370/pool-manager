<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت هوشمند بودجه استخر نقدینگی</title>
    <script src="js/libs/tailwind.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* انیمیشن برای نمایش و مخفی‌سازی متن‌های سایدبار */
        .sidebar-text {
            transition: opacity 0.2s ease-in-out, width 0.3s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-collapsed .sidebar-text {
            opacity: 0;
            width: 0;
            display: none;
        }

        .sidebar-expanded .sidebar-text {
            opacity: 1;
            width: auto;
            display: block;
        }

        /* موبایل: در حالت بسته، نوار آیکن‌ها کنار محتوا باقی بماند */
        @media (max-width: 767px) {
            #appSidebar.sidebar-collapsed {
                width: 4rem !important;
                transform: translateX(0) !important;
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased overflow-x-hidden">

    <!-- لایه مات‌کننده (Overlay) - فقط زمانی که منو در حالت فلوت/باز است نمایش داده می‌شود -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden transition-opacity opacity-0"></div>

    <!-- منوی کناری هوشمند (Sidebar) -->
    <!-- در دسکتاپ عرض اولیه w-16 (مینی). با کلاس sidebar-expanded عرض آن w-64 می‌شود و روی صفحه می‌آید -->
    <!-- z-50 باعث می‌شود همیشه روی لایه مات‌کننده و بدنه قرار گیرد -->
    <aside id="appSidebar"
        class="fixed top-0 right-0 h-full bg-slate-900 border-l border-slate-800 shadow-2xl z-50 flex flex-col transition-all duration-300 ease-in-out sidebar-collapsed translate-x-0 w-16 md:w-16">
        <div class="flex items-center justify-between p-4 border-b border-slate-800 min-h-[73px]">

            <!-- دکمه اصلی باز و بسته کردن سایدبار -->
            <button id="btnToggleSidebar" type="button" aria-label="باز کردن منو" aria-expanded="false"
                class="p-2 -mr-2 text-slate-400 hover:text-emerald-400 transition focus:outline-none rounded-lg hover:bg-slate-800">

                <svg id="sidebarToggleIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="2" stroke="currentColor" class="w-7 h-7">

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>

        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-2 space-y-2">
            <button data-target="dashboardSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl bg-emerald-500/10 text-emerald-400 transition"
                title="داشبورد اصلی">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">داشبورد اصلی</span>
            </button>
            <button data-target="budgetSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="پاکت‌های بودجه">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">پاکت‌های بودجه</span>
            </button>
            <button data-target="assetsSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="دارایی و اندوخته">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">دارایی و اندوخته</span>
            </button>
            <button data-target="expenseSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="ثبت مخارج">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">ثبت مخارج</span>
            </button>
            <button data-target="timelineSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="تایم‌لاین دوطرفه">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">تایم‌لاین دوطرفه</span>
            </button>
            <button data-target="incomeSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="درآمدها">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">درآمدها</span>
            </button>
            <button data-target="backupSection"
                class="sidebar-link w-full flex items-center px-2 py-3 text-sm font-medium rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"
                title="پشتیبان‌گیری">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
                    </svg>
                </div>
                <span class="sidebar-text mr-2">پشتیبان‌گیری</span>
            </button>
        </nav>

        <div class="p-2 border-t border-slate-800">
            <button
                class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-2 py-2.5 rounded-xl transition flex justify-center items-center overflow-hidden"
                title="پایان دوره فعلی">
                <div class="flex items-center justify-center w-8 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                </div>
                <span class="sidebar-text">پایان دوره فعلی</span>
            </button>
        </div>
    </aside>

    <!-- بدنه اصلی برنامه -->
    <!-- کلاس ثابت md:pr-16 در اینجا کلیدی است. بدنه همیشه کنار مینی‌سایدبار قرار می‌گیرد -->
    <!-- در موبایل چون منو مخفی است پدینگ سمت راست برداشته می‌شود -->
    <div id="layoutWrapper" class="w-full min-h-screen flex flex-col transition-all duration-300 pr-16 md:pr-16">
        <div class="max-w-6xl w-full mx-auto p-4 md:p-8 flex-1 flex flex-col">

            <header class="flex items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">

                    <div>
                        <h1 class="text-xl md:text-2xl font-black text-emerald-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0M12 12.75h.008v.008H12v-.008z" />
                            </svg>
                            Pool Manager
                        </h1>
                        <p id="currentCycleDisplay" class="text-xs text-slate-400 mt-1">دوره کاری فعال: در حال
                            بارگذاری...</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btnCloseMonthBtn"
                        class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-2 rounded-xl transition hidden sm:flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        بستن ماه
                    </button>
                </div>
            </header>

            <main class="pt-6 flex-1">
                <!-- داشبورد اصلی -->
                <section id="dashboardSection" class="space-y-6">
                    <div id="statCardsContainer"></div>
                    <div id="homeInsights" class="mt-6"></div>
                </section>

                <section id="budgetSection" class="hidden"></section>
                <section id="expenseSection" class="hidden"></section>
                <section id="timelineSection" class="hidden"></section>
                <section id="incomeSection" class="hidden"></section>
                <section id="assetsSection" class="hidden"></section>
                <section id="backupSection" class="hidden">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                        <h3 class="text-base font-bold text-slate-200">پشتیبان‌گیری و خروجی داده‌ها</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">برای جلوگیری از حذف داده‌ها و ذخیره در محل امن
                            از گزینه‌های زیر استفاده کنید:</p>
                        <div class="flex flex-wrap gap-3 pt-2">
                            <button id="btnExportJson"
                                class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl transition">خروجی
                                کامل JSON</button>
                            <label
                                class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl cursor-pointer transition">
                                بازیابی از فایل JSON
                                <input type="file" id="importJsonInput" accept=".json" class="hidden">
                            </label>
                            <button id="btnExportExcel"
                                class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs rounded-xl transition">خروجی
                                اکسل</button>
                            <button id="btnExportPdf"
                                class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-xs rounded-xl transition">خروجی
                                PDF</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- کانتینر مودال‌ها -->
    <div id="modalsContainer"></div>

    <!-- هسته کتابخانه‌ها -->
    <script src="js/libs/dexie.min.js"></script>
    <script src="js/db.js"></script>
    <!-- سرویس‌ها -->
    <script src="js/services/cycleService.js"></script>
    <script src="js/services/incomeService.js"></script>
    <script src="js/services/budgetService.js"></script>
    <script src="js/services/expenseService.js"></script>
    <script src="js/services/backupService.js"></script>
    <!-- کامپوننت‌های رابط کاربری -->
    <script src="components/statCards.js"></script>
    <script src="components/homeInsights.js"></script>
    <script src="components/budgetView.js"></script>
    <script src="components/expenseView.js"></script>
    <script src="components/incomeView.js"></script>
    <script src="components/timelineView.js"></script>
    <script src="components/modals.js"></script>
    <script src="components/datepicker.js"></script>
    <script src="components/assetsView.js"></script>
    <!-- رابط و هماهنگ‌کننده -->
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
