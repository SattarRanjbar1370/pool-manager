<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت هوشمند بودجه استخر نقدینگی</title>
    <script src="js/libs/tailwind.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">
    <div class="max-w-6xl mx-auto space-y-6">

        <!-- هدر برنامه -->
        <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-emerald-400 flex items-center gap-2">
                    <span>💼</span> مدیریت بودجه و جریان نقدینگی
                </h1>
                <p id="currentCycleDisplay" class="text-xs text-slate-400 mt-1">دوره کاری فعال: در حال بارگذاری...</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnCloseMonthBtn"
                    class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-2 rounded-xl transition">
                    🔒 بستن این ماه و انتقال به ماه بعد
                </button>
            </div>
        </header>

        <!-- کانتینر کارت‌های آماری (لود توسط کامپوننت) -->
        <div id="statCardsContainer"></div>

        <!-- نوار تب‌ها -->
        <div class="flex border-b border-slate-800 space-x-reverse space-x-1 overflow-x-auto">
            <button id="tabBudgetBtn"
                class="tab-btn px-5 py-2.5 font-medium text-sm rounded-t-xl transition border-b-2 border-emerald-500 bg-slate-800 text-emerald-400">
                📦 پاکت‌های بودجه‌بندی
            </button>
            <button id="tabExpenseBtn"
                class="tab-btn px-5 py-2.5 font-medium text-sm rounded-t-xl transition border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                💳 مخارج روزانه
            </button>
            <button id="tabTimelineBtn"
                class="tab-btn px-5 py-2.5 font-medium text-sm rounded-t-xl transition border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                📊 تایم‌لاین هزینه
            </button>
            <button id="tabIncomeBtn"
                class="tab-btn px-5 py-2.5 font-medium text-sm rounded-t-xl transition border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                💰 دریافتی و درآمدها
            </button>
            <button id="tabBackupBtn"
                class="tab-btn px-5 py-2.5 font-medium text-sm rounded-t-xl transition border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                💾 پشتیبان‌گیری
            </button>
        </div>

        <!-- کانتینر محتوای هر بخش (لود توسط کامپوننت‌ها) -->
        <main>
            <section id="budgetSection"></section>
            <section id="expenseSection" class="hidden"></section>
            <section id="timelineSection" class="hidden"></section>
            <section id="incomeSection" class="hidden"></section>
            <section id="backupSection" class="hidden">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                    <h3 class="text-base font-bold text-slate-200">پشتیبان‌گیری و خروجی داده‌ها</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">برای جلوگیری از حذف داده‌ها و ذخیره در محل امن از
                        گزینه‌های زیر استفاده کنید:</p>
                    <div class="flex flex-wrap gap-3 pt-2">
                        <button id="btnExportJson"
                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl transition">خروجی کامل
                            JSON</button>
                        <label
                            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl cursor-pointer transition">
                            بازیابی از فایل JSON
                            <input type="file" id="importJsonInput" accept=".json" class="hidden">
                        </label>
                        <button id="btnExportExcel"
                            class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs rounded-xl transition">خروجی
                            اکسل (Excel)</button>
                        <button id="btnExportPdf"
                            class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-xs rounded-xl transition">خروجی گزارش
                            PDF</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- کانتینر مودال‌ها و پاپ‌آپ‌ها -->
        <div id="modalsContainer"></div>

    </div>

    <!-- هسته کتابخانه‌ها (۱۰۰٪ لوکال و آفلاین) -->
    <script src="js/libs/dexie.min.js"></script>
    <script src="js/db.js"></script>

    <!-- سرویس‌ها -->
    <script src="js/services/cycleService.js"></script>
    <script src="js/services/incomeService.js"></script>
    <script src="js/services/budgetService.js"></script>
    <script src="js/services/expenseService.js"></script>
    <script src="js/services/backupService.js"></script>

    <!-- کامپوننت‌های رابط کاربری -->
    <script src="components/statCards.js"></script>
    <script src="components/budgetView.js"></script>
    <script src="components/expenseView.js"></script>
    <script src="components/incomeView.js"></script>
    <script src="components/timelineView.js"></script>
    <script src="components/modals.js"></script>
    <script src="components/datepicker.js"></script>

    <!-- رابط و هماهنگ‌کننده -->
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
