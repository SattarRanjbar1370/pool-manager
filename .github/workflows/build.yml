name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify financial calculations and JavaScript syntax
        run: |
          node --test tests/financial.test.cjs
          for f in js/app.js js/db.js js/services/*.js components/*.js; do node --check "$f"; done

      # ۱. نصب پکیج‌ها
      - name: Install Dependencies
        run: npm install

      # ۲. آماده‌سازی دارایی‌های وب در پوشه www
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html css js assets components www/

      - name: Verify packaged resources
        run: |
          test -f www/components/assetsView.js
          test -f www/js/db.js
          node --test tests/financial.test.cjs
          for f in js/app.js js/db.js js/services/*.js components/*.js; do node --check "$f"; done

      # ۳. اضافه کردن پلتفرم اندروید و همگام‌سازی
      - name: Setup Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      # ۴. تنظیم مجوز اجرایی گریدل و ساخت APK
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ۵. آپلود خروجی APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pool-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk